name: my-first-workflow
# To get a trigger on every push in this repo in any branch
on: push

jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: Running single command in job1
        run: echo "Hi, this is my first Github workflow"
      - name: Checking OS Release for Github Hosted Runner
        run: cat /etc/os-release
      - name: Calling sleep
        run: sleep 20
  job2:
    name: JOB2
    runs-on: ubuntu-latest
    steps:
      - name: Checking the Hostname for Runner
        run: hostname
      - name: Running multi commands
        run: |
          echo "Hi from Furkan"
          echo "Current time is $(date)"
          sleep 20
  job3:
    name: JOB3
    needs: job1
    runs-on: windows-latest
    steps:
      - name: Job with single Dependency
        run: sleep 10
      - name: Checking Runner Info
        shell: pwsh
        run: get-computerinfo
  job4:
    name: JOB4
    needs: [job1, job2, job3]
    runs-on: macos-latest
    steps:
      - name: Job for multiple dependencies
        run: sleep 10
      - name: Checking Runner Info
        run: sw_vers
          
