name: my-first-workflow
# To get a trigger on every push in this repo in any branch
on: push

jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: Step-1
        run: |
          pwd
          ls -ltr
          hostname
      - name: Step -2 - Checkout
        uses: actions/checkout@v6.0.3
      - name: Step -3
        run: |
          echo 'pwd' >> myartifact.txt
          mkdir artifacts
          echo 'ls -ltr' >> list.txt
          echo 'hostname' >> artifacts/hostname.txt
      - name: Upload Single File
        uses: actions/upload-artifact@v7.0.1
        with:
          name: single_file
          path: ./myartifact.txt
      - name: Upload From Directory
        uses: actions/upload-artifact@v7.0.1
        with:
          name: directory_artifacts
          path: artifacts/
      - name: Upload from multiple paths
        uses: actions/upload-artifact@v7.0.1
        with:
          name: multiple_paths
          path: |
             ./myartifact.txt
             artifatcs/
      - name: Upload from multiple paths with exclusions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: multiple_paths_with_exclusions
          path: |
             ./myartifact.txt
             artifatcs/
             !**/hostname.txt
  job2:
    name: JOB2
    runs-on: ubuntu-latest
    steps:
      - name: checking current directory
        run: |
          pwd
          ls -lrt
      - name: Download Single File Artifact
        uses: actions/download-artifact@v4
        with:
          name: single_file
      - name: checking current directory post download
        run: |
          pwd
          ls -lrt
      
        
          
